# ============================================================
# 小学数学练习试卷生成系统 — 多年级配置文件
# 支持北师大版1-6年级上下册（共12个学期）
# ============================================================

# ---- 当前激活的年级/学期（运行时通过 CLI/UI 切换） ----
active:
  grade: 2
  term: 2           # 1=上册, 2=下册

# ---- 教材 ----
textbook: "北师大版"

# ---- 12个学期的课程定义 ----
curriculum:
  "1-1":
    label: "一年级上册"
    units:
      - "第一单元 生活中的数"
      - "第二单元 比较"
      - "第三单元 加与减（一）"
      - "第四单元 分类"
      - "第五单元 位置与顺序"
      - "第六单元 认识图形"
      - "第七单元 加与减（二）"
      - "第八单元 认识钟表"

  "1-2":
    label: "一年级下册"
    units:
      - "第一单元 20以内数与加法"
      - "第二单元 图形大变身（一）"
      - "第三单元 20以内数与减法"
      - "第四单元 100以内数的认识"
      - "第五单元 100以内数加与减（一）"
      - "第六单元 有趣的平面图形（一）"

  "2-1":
    label: "二年级上册"
    units:
      - "第一单元 100以内数加与减（二）"
      - "第二单元 测量（一）"
      - "第三单元 数一数与乘法"
      - "第四单元 乘法口诀（一）"
      - "第五单元 分一分与除法"
      - "第六单元 图形的运动（一）"
      - "第七单元 乘法口诀（二）"
      - "第八单元 乘除法的应用（一）"

  "2-2":
    label: "二年级下册"
    units:
      - "第一单元 除法"
      - "第二单元 方向与位置"
      - "第三单元 生活中的大数"
      - "第四单元 测量"
      - "第五单元 加与减"
      - "第六单元 认识图形"
      - "第七单元 时、分、秒"
      - "第八单元 调查与记录"

  "3-1":
    label: "三年级上册"
    units:
      - "第一单元 混合运算"
      - "第二单元 测量（二）"
      - "第三单元 大数加与减（二）"
      - "第四单元 我们生活的空间（一）"
      - "第五单元 认识图形"
      - "第六单元 乘除法的应用（二）"
      - "第七单元 认识小数"
      - "第八单元 调查与记录"

  "3-2":
    label: "三年级下册"
    units:
      - "第一单元 整数乘法（一）"
      - "第二单元 图形的运动（二）"
      - "第三单元 周长"
      - "第四单元 整数除法（一）"
      - "第五单元 动手做"
      - "第六单元 关系与规律"
      - "第七单元 数据的整理与表示"

  "4-1":
    label: "四年级上册"
    units:
      - "第一单元 认识更大的数"
      - "第二单元 线与角"
      - "第三单元 乘法"
      - "第四单元 运算律"
      - "第五单元 方向与位置"
      - "第六单元 除法"
      - "第七单元 生活中的负数"
      - "第八单元 可能性"

  "4-2":
    label: "四年级下册"
    units:
      - "第一单元 小数的意义和加减法"
      - "第二单元 认识三角形和四边形"
      - "第三单元 小数乘法"
      - "第四单元 观察物体"
      - "第五单元 认识方程"
      - "第六单元 数据的表示和分析"

  "5-1":
    label: "五年级上册"
    units:
      - "第一单元 小数除法"
      - "第二单元 轴对称和平移"
      - "第三单元 倍数与因数"
      - "第四单元 多边形的面积"
      - "第五单元 分数的意义"
      - "第六单元 组合图形的面积"
      - "第七单元 可能性"

  "5-2":
    label: "五年级下册"
    units:
      - "第一单元 分数加减法"
      - "第二单元 长方体（一）"
      - "第三单元 分数乘法"
      - "第四单元 长方体（二）"
      - "第五单元 分数除法"
      - "第六单元 确定位置"
      - "第七单元 用方程解决问题"
      - "第八单元 数据的表示和分析"

  "6-1":
    label: "六年级上册"
    units:
      - "第一单元 圆"
      - "第二单元 分数混合运算"
      - "第三单元 观察物体"
      - "第四单元 百分数"
      - "第五单元 数据处理"
      - "第六单元 比的认识"
      - "第七单元 百分数的应用"

  "6-2":
    label: "六年级下册"
    units:
      - "第一单元 圆柱与圆锥"
      - "第二单元 比例"
      - "第三单元 图形的运动"
      - "第四单元 正比例与反比例"

# ---- 试卷结构 ----
exam:
  title_template: "{textbook}{grade_label}数学{term_label}练习卷（第{week}周）"
  total_score: 60
  sections:
    - id: oral_calc
      title: "一、口算题"
      count: 10
      score_per_question: 1
      difficulty_range: [1, 2]
      time_minutes: 3

    - id: fill_blank
      title: "二、填空题"
      count: 6
      score_per_question: 2
      difficulty_range: [1, 4]
      time_minutes: 4

    - id: choice
      title: "三、选择题"
      count: 4
      score_per_question: 2
      difficulty_range: [2, 4]
      time_minutes: 3

    - id: vertical_calc
      title: "四、竖式/脱式计算"
      count: 3
      score_per_question: 4
      difficulty_range: [2, 5]
      time_minutes: 5

    - id: word_problem
      title: "五、解决问题"
      count: 2
      score_per_question: 6
      difficulty_range: [3, 5]
      time_minutes: 5

  # 低年级减量
  grade_overrides:
    "1-1":
      total_score: 40
    "1-2":
      total_score: 40

# ---- 题库配置 ----
question_bank:
  db_path: "data/question_bank.db"
  seed_on_empty: true

  sync:
    enabled: true
    generator_enabled: true
    generator_count: 30
    use_builtin_urls: true
    scraper_url: ""
    scraper_urls:
      # 按年级标注，抓取时自动归类
      # 一年级
      - {url: "https://www.51test.net/show/4479150.html", grade: 1, term: 1}
      - {url: "https://www.51test.net/show/7071405.html", grade: 1, term: 2}
      - {url: "https://www.51test.net/show/3123664.html", grade: 1, term: 2}
      # 二年级
      - {url: "https://www.51test.net/show/11011779.html", grade: 2, term: 1}
      - {url: "https://www.51test.net/show/2968915.html", grade: 2, term: 2}
      - {url: "https://www.51test.net/show/11231919.html", grade: 2, term: 2}
      # 三年级
      - {url: "https://www.51test.net/show/11258648.html", grade: 3, term: 2}
      - {url: "https://www.51test.net/show/11164346.html", grade: 3, term: 1}
      # 四年级
      - {url: "https://www.51test.net/show/11011700.html", grade: 4, term: 1}
      - {url: "https://www.51test.net/show/11013282.html", grade: 4, term: 1}
      # 五年级
      - {url: "https://www.51test.net/show/11013300.html", grade: 5, term: 1}
      # 六年级
      - {url: "https://www.51test.net/show/11013316.html", grade: 6, term: 1}
    url: ""
    api_key: ""
    interval_hours: 0
    import_enabled: true

# ---- 排版渲染配置 ----
rendering:
  page:
    size: "A4"
    margin_top_cm: 2.0
    margin_bottom_cm: 2.0
    margin_left_cm: 2.5
    margin_right_cm: 2.5

  fonts:
    title: "黑体"
    heading: "楷体"
    body: "宋体"

  title:
    font_size_pt: 16
    bold: true
    alignment: "center"

  student_info:
    fields: ["姓名", "班级", "得分"]
    font_size_pt: 11

  body:
    font_size_pt: 12
    line_spacing: 1.5

  oral_calc:
    columns: 5

  graphics:
    clock_size_px: 200
